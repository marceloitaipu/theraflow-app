<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheraFlow - Gerenciar Dados</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .container {
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 1.6em; margin-bottom: 15px; }
        p { opacity: 0.9; margin-bottom: 20px; line-height: 1.5; font-size: 0.95em; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 25px;
            margin: 8px 0;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:active { opacity: 0.8; }
        .btn-green { background: #10b981; color: white; }
        .btn-orange { background: #f59e0b; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-gray { background: rgba(255,255,255,0.3); color: white; }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.2);
            font-size: 0.9em;
        }
        .success { background: rgba(16, 185, 129, 0.4); }
        .error { background: rgba(239, 68, 68, 0.4); }
        .data-info {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.85em;
            text-align: left;
        }
        .divider {
            border-top: 1px solid rgba(255,255,255,0.3);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Gerenciar TheraFlow</h1>
        
        <div class="data-info" id="dataInfo">Carregando...</div>

        <button class="btn btn-green" onclick="limparDadosNegocio()">
            🧹 Começar do Zero (Manter Login)
        </button>
        
        <button class="btn btn-red" onclick="apagarTudo()">
            🗑️ Apagar TUDO (Voltar ao Início)
        </button>
        
        <div class="divider"></div>
        
        <button class="btn btn-orange" onclick="atualizarApp()">
            🔄 Atualizar App (Limpar Cache)
        </button>
        
        <button class="btn btn-gray" onclick="irParaApp()">
            ▶️ Ir para o App
        </button>

        <div class="status" id="status" style="display: none;"></div>
    </div>

    <script>
        function atualizarInfo() {
            var clients = [];
            var sessions = [];
            var logged = false;
            
            try {
                clients = JSON.parse(localStorage.getItem('theraflow_clients')) || [];
                sessions = JSON.parse(localStorage.getItem('theraflow_sessions')) || [];
                logged = localStorage.getItem('theraflow_logged') === 'true';
            } catch(e) {}
            
            document.getElementById('dataInfo').innerHTML = 
                '📊 <strong>Dados Atuais:</strong><br>' +
                '• Logado: ' + (logged ? '✅ Sim' : '❌ Não') + '<br>' +
                '• Clientes: ' + clients.length + '<br>' +
                '• Sessões: ' + sessions.length;
        }

        function showStatus(msg, type) {
            var el = document.getElementById('status');
            el.style.display = 'block';
            el.className = 'status ' + (type || '');
            el.innerHTML = msg;
        }

        function limparDadosNegocio() {
            if (confirm('Isso vai apagar clientes, sessões e financeiro. Seu login será mantido. Continuar?')) {
                // Limpar dados - apenas sobrescrever com arrays vazios
                localStorage.setItem('theraflow_clients', '[]');
                localStorage.setItem('theraflow_sessions', '[]');
                localStorage.setItem('theraflow_packages', '[]');
                // Manter theraflow_initialized para não recriar dados
                localStorage.setItem('theraflow_initialized', 'true');
                
                showStatus('✅ Dados limpos! Clientes e sessões zerados.', 'success');
                atualizarInfo();
            }
        }

        function apagarTudo() {
            if (confirm('Isso vai apagar TUDO incluindo login. Você voltará à tela inicial. Continuar?')) {
                // Limpar absolutamente tudo
                localStorage.setItem('theraflow_clients', '[]');
                localStorage.setItem('theraflow_sessions', '[]');
                localStorage.setItem('theraflow_packages', '[]');
                localStorage.removeItem('theraflow_profile');
                localStorage.removeItem('theraflow_logged');
                localStorage.removeItem('theraflow_email');
                localStorage.removeItem('theraflow_onboarding');
                // Manter initialized para não recriar dados
                localStorage.setItem('theraflow_initialized', 'true');
                
                showStatus('✅ Tudo apagado! Redirecionando...', 'success');
                setTimeout(function() {
                    window.location.href = 'index.html';
                }, 1500);
            }
        }

        async function atualizarApp() {
            showStatus('🔄 Atualizando...', '');
            
            try {
                // Desregistrar Service Workers
                if ('serviceWorker' in navigator) {
                    var registrations = await navigator.serviceWorker.getRegistrations();
                    for (var reg of registrations) {
                        await reg.unregister();
                    }
                }
                
                // Limpar caches
                if ('caches' in window) {
                    var names = await caches.keys();
                    for (var name of names) {
                        await caches.delete(name);
                    }
                }
                
                showStatus('✅ Cache limpo! Recarregando...', 'success');
                setTimeout(function() {
                    window.location.reload(true);
                }, 1500);
                
            } catch(e) {
                showStatus('❌ Erro: ' + e.message, 'error');
            }
        }

        function irParaApp() {
            window.location.href = 'app.html';
        }

        // Inicializar
        atualizarInfo();
    </script>
</body>
</html>
