<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Fundo com bordas arredondadas (estilo app icon) -->
  <rect x="0" y="0" width="512" height="512" rx="102" ry="102" fill="url(#mainGradient)"/>
  
  <!-- Símbolo de fluxo/onda representando terapia -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" transform="translate(256, 256)">
    <!-- Onda superior -->
    <path d="M -130 -40 Q -80 -100, 0 -70 Q 80 -40, 130 -90" stroke-width="22" opacity="0.5"/>
    
    <!-- Onda central principal -->
    <path d="M -140 0 Q -70 -80, 0 0 Q 70 80, 140 0" stroke-width="30"/>
    
    <!-- Onda inferior -->
    <path d="M -130 40 Q -80 100, 0 70 Q 80 40, 130 90" stroke-width="22" opacity="0.5"/>
  </g>
  
  <!-- Ponto central de energia -->
  <circle cx="256" cy="256" r="24" fill="white" opacity="0.95"/>
  
  <!-- Pontos laterais -->
  <circle cx="156" cy="256" r="14" fill="white" opacity="0.4"/>
  <circle cx="356" cy="256" r="14" fill="white" opacity="0.4"/>
</svg>