<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradiente principal do app -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#667eea" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Fundo com bordas arredondadas (estilo app icon) -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Símbolo de fluxo/onda representando terapia -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round" transform="translate(256, 256)">
    <!-- Onda superior -->
    <path d="M -130 -40 Q -80 -100, 0 -70 Q 80 -40, 130 -90" stroke-width="20" opacity="0.5"/>
    
    <!-- Onda central principal -->
    <path d="M -140 0 Q -70 -80, 0 0 Q 70 80, 140 0" stroke-width="28"/>
    
    <!-- Onda inferior -->
    <path d="M -130 40 Q -80 100, 0 70 Q 80 40, 130 90" stroke-width="20" opacity="0.5"/>
  </g>
  
  <!-- Ponto central de energia -->
  <circle cx="256" cy="256" r="22" fill="white" opacity="0.95"/>
  
  <!-- Pontos laterais -->
  <circle cx="156" cy="256" r="12" fill="white" opacity="0.4"/>
  <circle cx="356" cy="256" r="12" fill="white" opacity="0.4"/>
</svg>