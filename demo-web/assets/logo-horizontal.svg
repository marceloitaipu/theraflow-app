<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <!-- Gradiente principal do app -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    
    <!-- Gradiente para o texto -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Ícone compacto -->
  <circle cx="40" cy="40" r="32" fill="url(#mainGradient)"/>
  
  <!-- Símbolo de fluxo simplificado -->
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <path d="M 22 35 Q 32 25, 40 32 Q 48 39, 58 30" opacity="0.6"/>
    <path d="M 20 40 Q 30 30, 40 40 Q 50 50, 60 40" stroke-width="5"/>
    <path d="M 22 45 Q 32 55, 40 48 Q 48 41, 58 50" opacity="0.6"/>
  </g>
  <circle cx="40" cy="40" r="3" fill="white" opacity="0.9"/>
  
  <!-- Texto TheraFlow -->
  <text x="85" y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="600" fill="url(#textGradient)">
    <tspan>Thera</tspan><tspan font-weight="700">Flow</tspan>
  </text>
</svg>