<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Gradiente principal do app -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    
    <!-- Gradiente secundário para destaque -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#667eea"/>
    </linearGradient>
    
    <!-- Sombra suave -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Círculo de fundo -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#shadow)"/>
  
  <!-- Símbolo de fluxo/onda representando terapia e movimento -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Primeira onda (mãos/energia fluindo) -->
    <path d="M 50 85 Q 70 60, 100 70 Q 130 80, 150 60" opacity="0.6"/>
    
    <!-- Segunda onda central (fluxo principal) -->
    <path d="M 45 100 Q 72 75, 100 100 Q 128 125, 155 100" stroke-width="8"/>
    
    <!-- Terceira onda -->
    <path d="M 50 115 Q 70 140, 100 130 Q 130 120, 150 140" opacity="0.6"/>
  </g>
  
  <!-- Ponto de energia/foco central -->
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.9"/>
  
  <!-- Pequenos pontos decorativos representando bem-estar -->
  <circle cx="60" cy="100" r="4" fill="white" opacity="0.5"/>
  <circle cx="140" cy="100" r="4" fill="white" opacity="0.5"/>
</svg>