name: Release APK

# Publica o APK release como um GitHub Release sempre que uma tag "v*" é criada.
# Uso: git tag v1.1.1 && git push origin v1.1.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex: v1.1.1)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build AppBundle (release)
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Rename artifacts
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/theraflow-${TAG}.apk"
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            cp build/app/outputs/bundle/release/app-release.aab "dist/theraflow-${TAG}.aab"
          fi
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: TheraFlow ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
